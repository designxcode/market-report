    /* ---------------- 旧版本地数据 ---------------- */

    function historyReports() {
        try {
            var list = JSON.parse(localStorage.getItem(REPORTS_KEY) || '[]');
            return Array.isArray(list) ? list : [];
        } catch (e) {
            return [];
        }
    }

    function absorbReports(list) {
        if (!list || !list.length) return 0;
        var merged = historyReports();
        var n = 0;
        list.forEach(function (r) {
            var clean = MR.sanitize ? MR.sanitize(r) : r;
            if (!clean || MR.isReportEmpty(clean)) return;
            merged = MR.upsert(merged, clean).reports;
            n += 1;
        });
        try { localStorage.setItem(REPORTS_KEY, JSON.stringify(merged)); } catch (e) { }
        return n;
    }

    function scanLegacy() {
        if (!Legacy) return;
        var res = Legacy.scanStorage();
        if (res.reports.length) {
            legacyReports = res.reports;
            legacyDays = res.days;
            absorbReports(legacyReports);
            if (!contentCount(state) && legacyDays.length) applyLegacyDay(legacyDays[0], true);
        }
        renderLegacyBanner();
    }

    function applyLegacyDay(day, silent) {
        var merged = Legacy.mergeDay(day.reports, (state.salesmanName || '').trim());
        var today = MR.todayStr();
        if (!state.salesmanName && day.salesmen && day.salesmen.length === 1 && day.salesmen[0] !== '未知') {
            state.salesmanName = day.salesmen[0];
        }
        if (merged.bagged && merged.bagged.length) state.bagged = merged.bagged.map(normalizeItem);
        if (merged.bulk && merged.bulk.length) state.bulk = merged.bulk.map(normalizeItem);
        state.product = countOf('bagged') ? 'bagged' : (countOf('bulk') ? 'bulk' : state.product);
        state.reportDate = today;
        state.carryFrom = day.date && day.date !== today ? day.date : '';
        var input = $('#reportDate');
        if (input) input.value = today;
        var nameInput = $('#salesmanName');
        if (nameInput && state.salesmanName) nameInput.value = state.salesmanName;
        saveDraft();
        render();
        showCarry();
        if (!silent) {
            UI.toast('已带入 ' + dateLabel(day.date) + ' 的内容，日期已切到今天');
            UI.closeSheet('sheetMask');
        }
    }

    function renderLegacyBanner() {
        var box = $('#legacyBanner');
        if (!box) return;
        if (!legacyDays.length) { box.style.display = 'none'; return; }
        var latest = legacyDays[0];
        var names = latest.salesmen.slice(0, 3).join('、');
        $('#legacyText').textContent = '本机找到 ' + legacyDays.length + ' 天旧版本地数据（最近 ' + dateLabel(latest.date) +
            (names ? '，' + names : '') + '），已并入本机历史。去「历史数据」挑一天带过来改，日期自动变今天。';
        box.style.display = '';
    }

    function legacyRow(day, idx) {
        return '<div class="card" style="margin:0 0 8px;">' +
            '<div class="row" style="justify-content:space-between;">' +
            '<div><b>' + UI.esc(dateLabel(day.date)) + '</b>' +
            '<div class="note">' + day.reports.length + ' 条 · ' + day.regions + ' 个地区 · ' + day.brands + ' 个品牌' +
            (day.salesmen.length ? ' · ' + UI.esc(day.salesmen.join('、')) : '') + '</div></div>' +
            '<button type="button" class="btn sm primary" data-legacy-day="' + idx + '">带入</button>' +
            '</div></div>';
    }

    function showHistoryData() {
        var sent = sentHistory();
        var days = legacyDays.slice(0, 15);
        var html = '<p class="note" style="margin-bottom:8px;">最近发送的文本点「复制这条」可直接再发；旧版本机数据点「带入」就把那天的内容带到今天，随便改。' +
            '要从微信或文件恢复更多，去「设置」。</p>' +
            '<div class="group-title">最近发送（最近 10 条）</div>' +
            sentRowsHtml() +
            '<div class="group-title" style="margin-top:16px;">旧版本地数据（' + legacyDays.length + ' 天）</div>' +
            (days.length ? days.map(legacyRow).join('') :
                '<div class="empty">本机没有找到旧版数据，去「设置 → 从微信粘贴恢复 / 从文件导入」。</div>');

        showSheet('历史数据', html, [{ text: '关闭', cls: 'ghost', onClick: function () { UI.closeSheet('sheetMask'); } }]);

        bindSentRows(sent);
        UI.$$('[data-legacy-day]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var day = legacyDays[+btn.dataset.legacyDay];
                if (day) applyLegacyDay(day, false);
            });
        });
    }

    /* ---------------- 与历史对比（日期可自选） ---------------- */

    function numOf(v) {
        if (v === '' || v === null || v === undefined) return null;
        var n = Number(v);
        return isNaN(n) ? null : n;
    }

    function dateLabel(d) {
        var m = String(d || '').split('-');
        if (m.length < 3) return d || '—';
        return (+m[1]) + '月' + (+m[2]) + '日';
    }

    function rowsOf(rep) {
        var map = {};
        ['bagged', 'bulk'].forEach(function (p) {
            (rep[p] || []).forEach(function (item) {
                var region = item.region || item.name || '';
                (item.brands || []).forEach(function (b) {
                    if (!b.name) return;
                    var type = b.type || '';
                    var k = [region, b.name, type].join('|');
                    var rec = { region: region, brand: b.name, type: type, product: p, price: numOf(b.price), price2: numOf(b.price2), freight: numOf(b.freight) };
                    if (!map[k]) map[k] = rec;
                });
            });
        });
        return map;
    }

    /** 本机可用的历史报告：本机录入(mr_reports_v2) + 发送记录，按日期取最新一条 */
    function localHistoryReports() {
        var out = [];
        try {
            var list = JSON.parse(localStorage.getItem('mr_reports_v2') || '[]');
            (Array.isArray(list) ? list : []).forEach(function (r) {
                if (!r || !r.reportDate) return;
                out.push({ date: MR.normalizeDate(r.reportDate), rep: MR.sanitize ? MR.sanitize(r) : r, t: r.createTime || '', src: '本机录入' });
            });
        } catch (e) { }
        sentHistory().forEach(function (h) {
            var rep = MR.parseOne(h.text || '');
            if (!rep || MR.isReportEmpty(rep) || !rep.reportDate) return;
            out.push({ date: MR.normalizeDate(rep.reportDate), rep: rep, t: h.t || '', src: '发送记录' });
        });
        var best = {};
        out.forEach(function (x) {
            if (!x.date) return;
            var cur = best[x.date];
            if (!cur || String(x.t) > String(cur.t)) best[x.date] = x;
        });
        return Object.keys(best).map(function (k) { return best[k]; })
            .sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
    }

    function buildDiff(baseRep, currentRep) {
        var nowRep = currentRep || state;
        var oldMap = rowsOf(baseRep);
        var nowMap = rowsOf(nowRep);
        var keys = Object.keys(oldMap);
        Object.keys(nowMap).forEach(function (k) { if (!oldMap[k]) keys.push(k); });
        var rows = [];
        keys.forEach(function (k) {
            var o = oldMap[k], n = nowMap[k];
            var row = { region: (n || o).region, brand: (n || o).brand, type: (n || o).type, product: (n || o).product, oldP: o ? o.price : null, newP: n ? n.price : null, oldF: o ? o.freight : null, newF: n ? n.freight : null };
            if (!o) row.kind = 'added';
            else if (!n) row.kind = 'missing';
            else if (o.price !== null && n.price !== null && o.price !== n.price) row.kind = n.price > o.price ? 'up' : 'down';
            else if (o.freight !== null && n.freight !== null && o.freight !== n.freight) row.kind = 'freight';
            else row.kind = 'same';
            rows.push(row);
        });
        var order = { up: 0, down: 1, freight: 2, added: 3, missing: 4, same: 5 };
        rows.sort(function (a, b) { return (order[a.kind] || 0) - (order[b.kind] || 0) || (a.region > b.region ? 1 : -1); });
        return rows;
    }

    /** 今天已提交过同一业务员的上一版，用于发送后做非阻断的改动摘要 */
    function previousSameDayReport(name) {
        var hist = localHistoryReports();
        for (var i = 0; i < hist.length; i += 1) {
            var rep = hist[i].rep;
            if (!rep) continue;
            if (MR.normalizeDate(rep.reportDate) !== MR.normalizeDate(state.reportDate)) continue;
            if ((rep.salesmanName || '').trim() !== name) continue;
            if (MR.isReportEmpty(rep) || !contentCount(rep)) continue;
            return rep;
        }
        return null;
    }

    function changedRows(rows) {
        return (rows || []).filter(function (r) { return r && r.kind !== 'same'; });
    }

    function diffHtml(baseRep, baseDate) {
        var rows = buildDiff(baseRep);
        var cnt = { up: 0, down: 0, freight: 0, added: 0, missing: 0, same: 0 };
        rows.forEach(function (r) { cnt[r.kind] += 1; });
        var changed = cnt.up + cnt.down + cnt.freight + cnt.added + cnt.missing;

        function money(v) { return v === null ? '—' : String(v); }
        function priceCell(r) {
            if (r.kind === 'up' || r.kind === 'down') {
                var d = r.newP - r.oldP;
                var sign = d > 0 ? '+' : '';
                return money(r.oldP) + ' → <b>' + money(r.newP) + '</b> <span class="delta-' + (r.kind === 'up' ? 'up' : 'down') + '">' + sign + (Math.round(d * 100) / 100) + '</span>';
            }
            return '<span class="' + (r.kind === 'missing' ? 'delta-flat' : '') + '">' + money(r.oldP) + '</span> › ' + money(r.newP);
        }
        function tag(kind) {
            return { up: '涨', down: '跌', freight: '仅运费', added: '新增', missing: '本次未填', same: '没变' }[kind] || '';
        }

        var head = '<div class="note" style="margin-bottom:8px;">基准：<b>' + UI.esc(dateLabel(baseDate)) + '</b>' +
            '（' + UI.esc(baseRep.salesmanName || state.salesmanName || '本机记录') + '）。' +
            (changed ? '<b>' + changed + '</b> 处有变化：涨 ' + cnt.up + ' · 跌 ' + cnt.down + ' · 仅运费 ' + cnt.freight + ' · 新增 ' + cnt.added + ' · 本次未填 ' + cnt.missing
                : '和基准完全一致，可直接复制发微信') + '。</div>';

        if (!rows.length) return head + '<div class="empty">两边都没有可比的数据</div>';

        var body = rows.map(function (r) {
            var p = r.product === 'bulk' ? '散' : '袋';
            return '<tr class="cmp-' + r.kind + '">' +
                '<td>' + UI.esc(r.region || '未填') + '</td>' +
                '<td>' + UI.esc(r.brand) + (r.type ? '<div class="note">' + UI.esc(r.type) + p + '</div>' : '<div class="note">' + p + '装</div>') + '</td>' +
                '<td>' + priceCell(r) + '</td>' +
                '<td>' + (r.oldF === null ? '—' : r.oldF) + (r.oldF !== null && r.newF !== null && r.oldF !== r.newF ? ' → ' + r.newF : '') + '</td>' +
                '<td>' + tag(r.kind) + '</td>' +
                '</tr>';
        }).join('');

        return head +
            '<div style="overflow-x:auto;"><table class="cmp-table"><thead><tr><th>地区</th><th>品牌</th><th>价格（基准→本次）</th><th>运费</th><th>变化</th></tr></thead><tbody>' +
            body + '</tbody></table></div>';
    }

    function showCompare() {
        var hist = localHistoryReports().filter(function (x) { return x.date !== state.reportDate; });
        if (!hist.length) {
            showSheet('与历史数据对比', '<div class="empty">这台手机上还没有更早的报告记录。<br>本机对比只用「本机录入 + 最近 10 次发送记录」，' +
                '第一次用或换了手机时没有历史可对比；管理端有全部数据，可到管理端看对比。</div>',
                [{ text: '关闭', cls: 'ghost', onClick: function () { UI.closeSheet('sheetMask'); } }]);
            return;
        }

        var options = hist.map(function (x) {
            return '<option value="' + UI.esc(x.date) + '">' + UI.esc(dateLabel(x.date) + '（' + x.src + '）') + '</option>';
        }).join('');
        var html = '<div class="row" style="margin-bottom:10px;align-items:center;">' +
            '<span class="note">对比日期</span>' +
            '<select class="select" id="cmpDate" style="flex:1;">' + options + '</select>' +
            '</div><div id="cmpBody"></div>';

        showSheet('与历史数据对比', html, [{ text: '关闭', cls: 'ghost', onClick: function () { UI.closeSheet('sheetMask'); } }]);

        function paint(date) {
            var hit = hist.filter(function (x) { return x.date === date; })[0];
            var box = document.getElementById('cmpBody');
            if (!box || !hit) return;
            box.innerHTML = diffHtml(hit.rep, hit.date);
        }

        var sel = document.getElementById('cmpDate');
        if (sel) {
            // 默认选中今天之前最近的一天
            var today = MR.todayStr();
            var prefer = hist.filter(function (x) { return x.date < today; })[0] || hist[0];
            sel.value = prefer.date;
            sel.addEventListener('change', function () { paint(sel.value); });
            paint(prefer.date);
        }
    }

    /* ---------------- 弹层 ---------------- */

    /**
     * iOS Safari 的 datalist 在部分系统版本上不显示下拉（WKWebView 更明显），
     * 这里给地区和品牌提供可点、可搜的原生弹层，安卓/桌面仍保留手输 + datalist。
     */
    function openPicker(kind, ri, bi) {
        var options = kind === 'region' ? (Dict ? Dict.regions() : []) : (Dict ? Dict.brands() : []);
        var item = state[state.product][ri];
        var current = kind === 'region'
            ? String((item && item.region) || '')
            : String((item && item.brands && item.brands[bi] && item.brands[bi].name) || '');
        var title = kind === 'region' ? '选择地区' : '选择品牌';
        var hint = kind === 'region'
            ? '点下面的标准地区，管理端就能对上竞家表的行。找不到的才手动填。'
            : '点下面的标准品牌，接收端和导出表更容易识别。新品牌可直接关掉后手填。';
        var html = '<p class="note" style="margin:0 0 8px;">' + hint + '</p>' +
            '<div class="picker-search"><input class="input" id="pickerSearch" placeholder="输入关键词筛选" autocomplete="off" autocorrect="off" autocapitalize="off"></div>' +
            '<div class="picker-list" id="pickerList"></div>';

        showSheet(title, html, [{ text: '关闭', cls: 'ghost', onClick: function () { UI.closeSheet('sheetMask'); } }]);

        var list = $('#pickerList');
        var search = $('#pickerSearch');
        if (!list) return;

        function paint(keyword) {
            var kw = String(keyword || '').trim();
            var filtered = kw ? options.filter(function (v) { return String(v).indexOf(kw) >= 0; }) : options;
            if (!filtered.length) {
                list.innerHTML = '<p class="note" style="padding:12px 2px;">没有匹配。关掉后可以直接在输入框里手填。</p>';
                return;
            }
            list.innerHTML = filtered.map(function (v) {
                var active = String(v) === current ? ' active' : '';
                return '<button type="button" class="picker-item' + active + '" data-pick-value="' + UI.esc(v) + '">' +
                    UI.esc(v) + '</button>';
            }).join('');
        }

        list.addEventListener('click', function (e) {
            var btn = e.target.closest && e.target.closest('[data-pick-value]');
            if (!btn) return;
            var value = btn.dataset.pickValue;
            var row = state[state.product][ri];
            if (!row) return;
            if (kind === 'region') {
                row.region = value;
            } else {
                var brand = row.brands[bi];
                if (!brand) return;
                brand.name = value;
            }
            UI.closeSheet('sheetMask');
            render();
            saveDraft();
            UI.toast(kind === 'region' ? '已选择地区：' + value : '已选择品牌：' + value);
        });

        if (search) {
            search.addEventListener('input', function () { paint(search.value); });
        }
        paint('');
    }

    function showSheet(title, html, buttons) {
        $('#sheetTitle').textContent = title;
        $('#sheetContent').innerHTML = html;
        var foot = $('#sheetFoot');
        foot.innerHTML = '';
        (buttons || []).forEach(function (b) {
            var el = document.createElement('button');
            el.type = 'button';
            el.className = 'btn ' + (b.cls || 'ghost');
            el.textContent = b.text;
            if (b.cls === 'primary') el.classList.add('primary');
            foot.appendChild(el);
            if (b.onClick) el.addEventListener('click', b.onClick);
        });
        UI.openSheet('sheetMask');
    }

    /* ---------------- 初始化 ---------------- */

    function hideCarry() {
        var box = $('#carryBanner');
        if (box) box.style.display = 'none';
    }

    function showCarry() {
        var box = $('#carryBanner');
        if (!box || !state.carryFrom) return;
        $('#carryTitle').textContent = '已自动更新到 ' + dateLabel(state.reportDate);
        $('#carryText').textContent = '内容沿用了 ' + dateLabel(state.carryFrom) + ' 的填写。价格没变就直接点右下角「复制发微信」；有变化改完再复制。';
        box.style.display = '';
    }

    function fillDatalists() {        var regions = Dict ? Dict.regions() : [];
        var brands = Dict ? Dict.brands() : [];
        $('#regionOptions').innerHTML = regions.map(function (r) {
            return '<option value="' + UI.esc(r) + '">';
        }).join('');
        $('#brandOptions').innerHTML = brands.map(function (b) {
            return '<option value="' + UI.esc(b) + '">';
        }).join('');
    }

    function init() {
        loadDraft();
        scanLegacy();
        ensureRows();
        fillDatalists();

        $('#salesmanName').value = state.salesmanName;
        $('#reportDate').value = state.reportDate || MR.todayStr();

        render();
        bindEvents();
        showCarry();

        // 站点上放了 assets/dict.json 就自动用最新字典（file:// 时会静默失败）
        if (Dict && Dict.tryRemote) {
            Dict.tryRemote().then(function (changed) {
                if (changed) { fillDatalists(); render(); }
            });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>
</body>
